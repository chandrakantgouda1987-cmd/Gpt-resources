<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ದ್ವಿಭಾಷಾ ಮತ್ತು ಆಂಗ್ಲ ಮಾಧ್ಯಮ ಶೈಕ್ಷಣಿಕ ಸಂಪನ್ಮೂಲಗಳು</title>
    <style>
        /* ಮೂಲ ವಿನ್ಯಾಸ ಮತ್ತು ಬಣ್ಣಗಳು */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e6f2ff; /* ತಿಳಿ ನೀಲಿ ಹಿನ್ನೆಲೆ */
            color: #333;
        }

        /* ಟಾಪ್ ಮೆನು ಬಾರ್ (Navigation Bar) */
        .navbar {
            background-color: #f3e5ab; /* ಫೋಟೋದಲ್ಲಿರುವಂತೆ ಗೋಲ್ಡನ್/ಕ್ರೀಮ್ ಬಣ್ಣ */
            display: flex;
            justify-content: space-around;
            padding: 15px;
            border-bottom: 3px solid #0056b3;
            font-weight: bold;
        }

        .navbar a {
            text-decoration: none;
            color: #000;
            font-size: 16px;
            text-transform: uppercase;
        }

        .navbar a:hover {
            color: #ff4500; /* ಮೌಸ್ ಇಟ್ಟಾಗ ಬದಲಾಗುವ ಬಣ್ಣ */
        }

        /* ಮುಖ್ಯ ಭಾಗ (Main Container) */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            display: flex;
            gap: 20px;
            padding: 0 10px;
        }

        /* ಎಡಭಾಗದ ಸೈಡ್ ಬಾರ್ */
        .sidebar {
            flex: 1;
            background-color: #ffffff;
            border: 2px solid #b3d7ff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* ಮಧ್ಯದ ಮುಖ್ಯ ಬ್ಯಾನರ್ ಭಾಗ */
        .main-content {
            flex: 3;
            background-color: #ffffff;
            border: 4px solid #007bff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* ಕನ್ನಡ ಶೀರ್ಷಿಕೆ ಪಟ್ಟಿ */
        .kannada-title {
            border: 2px solid #ffcc00;
            background-color: #fffdf0;
            padding: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        /* ರೇನ್ಬೋ ಬ್ಯಾನರ್ ಕಾರ್ಡ್ */
        .banner-card {
            background: linear-gradient(to bottom, #66ccff, #ffffff);
            border-radius: 10px;
            padding: 40px 20px;
            border: 2px dashed #007bff;
            position: relative;
            overflow: hidden;
        }

        .banner-title {
            font-size: 28px;
            font-weight: bold;
            color: #d9534f;
            text-shadow: 2px 2px #fff;
            margin-bottom: 10px;
        }

        .sub-title {
            font-size: 20px;
            color: #5cb85c;
            font-weight: bold;
        }

        /* ರೆಸ್ಪಾನ್ಸಿವ್ ಡಿಸೈನ್ (ಮೊಬೈಲ್‌ಗಾಗಿ) */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#">Bridge Course</a>
        <a href="#">Bilingual Orders</a>
        <a href="#">Lesson Plans</a>
        <a href="#">Contact</a>
    </div>

    <div class="container">
        
        <div class="sidebar">
            <h3 style="color: #007bff;">ECCE Resources</h3>
            <p>➜ Resources 1</p>
            <p>➜ Resources 2</p>
        </div>

        <div class="main-content">
            <div class="kannada-title">
                ಈ ಸಾಲಿನ ಕರ್ನಾಟಕ ಶಾಲಾ ಶಿಕ್ಷಣ ಇಲಾಖೆಯ ಧ್ವೇಯ
            </div>
            
            <div class="banner-card">
                <div class="banner-title">Welcome to Bilingual Resources Website</div>
                <div class="sub-title">Learn • Play • Excel</div>
                <p style="margin-top: 30px; color: #666;">[ಇಲ್ಲಿ ನೀವು ಫೋಟೋದಲ್ಲಿರುವ ಮಕ್ಕಳ ಚಿತ್ರ ಅಥವಾ ರೇನ್ಬೋ ಇಮೇಜ್ ಅನ್ನು ಅಪ್ಲೋಡ್ ಮಾಡಬಹುದು]</p>
            </div>
        </div>

    </div>

</body>
</html>
